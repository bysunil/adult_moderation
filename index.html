<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Content Moderation Video Player</title>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="logo-group">
      <span class="logo-badge">AI Sentinel</span>
      <h1 class="logo-title">Smart Video Moderation Player</h1>
    </div>

    <div class="header-actions">
      <!-- Upload local video -->
      <label class="btn-upload" title="Open any local MP4 video file from your computer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Open Video File</span>
        <input type="file" id="local-video-file-input" accept="video/mp4,video/webm">
      </label>

      <!-- Load custom timeline JSON -->
      <label class="btn-upload" title="Load custom timeline.json file">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span>Load Timeline JSON</span>
        <input type="file" id="local-json-file-input" accept="application/json">
      </label>

      <button id="toggle-settings-btn" class="btn-settings-toggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Content Filters</span>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="main-container">

    <!-- Video Stage Left -->
    <section class="player-stage">
      <div class="video-frame-wrapper" id="video-wrapper">
        <video id="main-video-element" controls preload="metadata" playsinline>
          <!-- Default loaded video from stream server -->
          <source src="/stream_video?file=ANIMAL_with_chapters.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>

        <!-- Dynamic Skip Notification Banner -->
        <div id="skip-notification" class="skip-notification-banner">
          <div class="skip-indicator-dot"></div>
          <span id="skip-notification-text">Skipped Adult Content Interval (00:25 → 01:59)</span>
        </div>
      </div>

      <!-- Visual Interactive Timeline with Color Segments -->
      <div class="visual-timeline-container">
        <div class="timeline-info-row">
          <span id="playback-time-display">00:00 / 00:00</span>
          <div id="current-content-badge" class="current-status-tag">
            <span class="status-indicator">●</span>
            <span id="current-status-label">Normal Content</span>
          </div>
        </div>

        <!-- Custom scrub track -->
        <div class="timeline-track-wrapper" id="timeline-track">
          <!-- Color-coded segments for detected categories -->
          <div class="timeline-segment-layer" id="timeline-segment-layer"></div>
          <div class="timeline-playhead-fill" id="timeline-playhead-fill"></div>
          <div class="timeline-scrubber-handle" id="timeline-scrubber-handle"></div>
        </div>
      </div>
    </section>

    <!-- Right Sidebar: Settings & Skip Preferences -->
    <aside class="sidebar-panel">

      <!-- Settings & Skip Customization Card -->
      <div class="settings-card">
        <div class="card-title-row">
          <h2 class="card-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            Auto-Skip Preferences
          </h2>
          <span class="badge-counter" id="active-rules-counter">Active</span>
        </div>

        <!-- Master Switch -->
        <div class="master-toggle-box">
          <div class="toggle-info">
            <h4>Enable Auto-Skip</h4>
            <p>Automatically fast-forward past selected violations</p>
          </div>
          <label class="switch">
            <input type="checkbox" id="master-skip-switch" checked>
            <span class="slider"></span>
          </label>
        </div>

        <!-- Category Granular Toggles -->
        <div class="categories-filter-list" id="category-toggles-container">
          <!-- Populated dynamically via JS -->
        </div>
      </div>

      <!-- Detected Chapters & Intervals List -->
      <div class="intervals-card">
        <div class="card-title-row">
          <h3 class="card-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            Detected Scenes Timeline
          </h3>
          <span class="badge-counter" id="total-scenes-counter">0 Scenes</span>
        </div>

        <div class="intervals-scroll-list" id="intervals-list-container">
          <!-- Populated dynamically via JS -->
        </div>
      </div>

    </aside>

  </main>

  <script src="player.js"></script>
</body>
</html>
